services:
  inventory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stock1234
      POSTGRES_DB: stocksync_inventory
    ports:
      - "5432:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-api:
    build:
      context: ./InventoryService
      dockerfile: StockSync.Inventory.WebApi/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=inventory-db;Database=stocksync_inventory;Username=postgres;Password=stock1234
    depends_on:
      inventory-db:
        condition: service_healthy

volumes:
  inventory_data:
