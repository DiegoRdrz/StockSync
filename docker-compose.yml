services:
  inventory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock1234}
      POSTGRES_DB: stocksync_inventory
    ports:
      - "5432:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-api:
    build:
      context: ./InventoryService
      dockerfile: StockSync.Inventory.WebApi/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=inventory-db;Database=stocksync_inventory;Username=postgres;Password=${POSTGRES_PASSWORD:-stock1234}
      - Initialization__ApplyMigrations=true
      - Initialization__LoadDemoData=${LOAD_DEMO_DATA:-true}
      - Jwt__Issuer=StockSync.Identity
      - Jwt__Audience=StockSync.Ecosystem
      - Jwt__SecretKey=${JWT_SECRET_KEY:-StockSyncSuperSecretSecureKey123456789!NeverShareInProduction!}
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-stocksync}:${RABBITMQ_PASSWORD:-stocksync}@rabbitmq:5672
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock1234}
      POSTGRES_DB: stocksync_identity
    ports:
      - "5433:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-api:
    build:
      context: ./IdentityService
      dockerfile: StockSync.Identity.WebApi/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=identity-db;Database=stocksync_identity;Username=postgres;Password=${POSTGRES_PASSWORD:-stock1234}
      - Initialization__ApplyMigrations=true
      - Initialization__LoadDemoData=${LOAD_DEMO_DATA:-true}
      - Jwt__Issuer=StockSync.Identity
      - Jwt__Audience=StockSync.Ecosystem
      - Jwt__SecretKey=${JWT_SECRET_KEY:-StockSyncSuperSecretSecureKey123456789!NeverShareInProduction!}
    depends_on:
      identity-db:
        condition: service_healthy

  orders-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock1234}
      POSTGRES_DB: stocksync_orders
    ports:
      - "5434:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stocksync}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stocksync}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Run diagnostics as the broker user so a startup probe cannot create a root-owned cookie.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  orders-api:
    build:
      context: ./OrdersService
      dockerfile: StockSync.Orders.WebApi/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=orders-db;Database=stocksync_orders;Username=postgres;Password=${POSTGRES_PASSWORD:-stock1234}
      - Initialization__ApplyMigrations=true
      - Inventory__BaseUrl=http://inventory-api:8080
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-stocksync}:${RABBITMQ_PASSWORD:-stocksync}@rabbitmq:5672
      - Jwt__Issuer=StockSync.Identity
      - Jwt__Audience=StockSync.Ecosystem
      - Jwt__SecretKey=${JWT_SECRET_KEY:-StockSyncSuperSecretSecureKey123456789!NeverShareInProduction!}
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-api:
        condition: service_started

  reporting-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock1234}
      POSTGRES_DB: stocksync_reporting
    ports:
      - "5435:5432"
    volumes:
      - reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

  reporting-api:
    build:
      context: ./ReportingService
      dockerfile: StockSync.Reporting.WebApi/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=reporting-db;Database=stocksync_reporting;Username=postgres;Password=${POSTGRES_PASSWORD:-stock1234}
      - Initialization__ApplyMigrations=true
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-stocksync}:${RABBITMQ_PASSWORD:-stocksync}@rabbitmq:5672
    depends_on:
      reporting-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock1234}
      POSTGRES_DB: stocksync_notification
    ports:
      - "5436:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_notification"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-api:
    build:
      context: ./NotificationService
      dockerfile: StockSync.Notification.WebApi/Dockerfile
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=notification-db;Database=stocksync_notification;Username=postgres;Password=${POSTGRES_PASSWORD:-stock1234}
      - Initialization__ApplyMigrations=true
      - Initialization__LoadDemoData=${LOAD_DEMO_DATA:-true}
      - RabbitMq__ConnectionString=amqp://${RABBITMQ_USER:-stocksync}:${RABBITMQ_PASSWORD:-stocksync}@rabbitmq:5672
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./ApiGateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9090}:9090"
    environment:
      HOST: 0.0.0.0
      PORT: 9090
      INVENTORY_API_URL: http://inventory-api:8080
      IDENTITY_API_URL: http://identity-api:8080
      ORDERS_API_URL: http://orders-api:8080
      REPORTING_API_URL: http://reporting-api:8080
      NOTIFICATION_API_URL: http://notification-api:8080
      TENANT_ID: ${GATEWAY_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      UPSTREAM_TIMEOUT_MS: 10000
    depends_on:
      inventory-api:
        condition: service_started
      identity-api:
        condition: service_started
      orders-api:
        condition: service_started
      reporting-api:
        condition: service_started
      notification-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inventory_data:
  identity_data:
  reporting_data:
  orders_data:
  notification_data:
  rabbitmq_data:
