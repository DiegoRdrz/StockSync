server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the gateway has no CORS, so nginx forwards /api to it.
  location /api/ {
    proxy_pass http://api-gateway:9090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The HTML shell must always be revalidated so a new build is picked up;
  # hashed files under /assets are the ones cached long term.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
